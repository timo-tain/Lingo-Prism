name: Build and publish macOS release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (for example 0.3.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve and validate version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="v${INPUT_VERSION#v}"
          else
            tag="$REF_NAME"
          fi

          version="${tag#v}"
          plist_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [[ "$version" != "$plist_version" ]]; then
            echo "Tag $tag does not match CFBundleShortVersionString $plist_version" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./Scripts/make-app.sh

      - name: Package release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          zip_path="release/Lingo-Prism-v${VERSION}-macOS.zip"
          dmg_path="release/Lingo-Prism-v${VERSION}-macOS.dmg"

          ditto -c -k --sequesterRsrc --keepParent \
            "dist/Lingo Prism.app" "$zip_path"
          ./Scripts/make-dmg.sh "$dmg_path"
          shasum -a 256 "$zip_path" > "${zip_path}.sha256"
          shasum -a 256 "$dmg_path" > "${dmg_path}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "release/Lingo-Prism-v${VERSION}-macOS.dmg"
            "release/Lingo-Prism-v${VERSION}-macOS.dmg.sha256"
            "release/Lingo-Prism-v${VERSION}-macOS.zip"
            "release/Lingo-Prism-v${VERSION}-macOS.zip.sha256"
          )

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Lingo Prism $TAG" \
              --generate-notes \
              --notes "This release is an ad-hoc-signed macOS build. Developer ID signing and Apple notarization can be added when distribution credentials are available."
          fi
